<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"><meta name="theme-color" content="#11151a"><title>灰街 第一部完結版 ランチャー</title><style>body{margin:0;font-family:system-ui,"Noto Sans JP",sans-serif;background:#101419;color:#eee;min-height:100vh;display:grid;place-items:center}.card{width:min(860px,92vw);padding:32px;border:1px solid #4b3f2a;background:linear-gradient(140deg,#242b32,#171b20);box-shadow:0 20px 80px #0008}h1{font-family:serif;font-size:clamp(30px,6vw,56px);margin:0 0 8px}.links{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}a,button{display:inline-block;padding:13px 18px;border:1px solid #b98942;background:#31251b;color:#fff;text-decoration:none;border-radius:8px;font-weight:800}button{cursor:pointer}.muted{color:#b8b0a0;line-height:1.8}.status{margin-top:18px;padding:12px;border-left:4px solid #b98942;background:#0004}</style></head><body><main class="card"><p>第一章〜第二章 第一部完結版</p><h1>灰街の巡察官と嘘の地図</h1><p class="muted">第一章の判断を第二章へ継承し、評議会中枢・最終推理・灰街そのものとの噂戦・終局報告・分岐エピローグまで遊べます。</p><div class="links"><a href="haimachi_chapter1_transfer/index.html">第一章から始める</a><a href="haimachi_chapter2_inheritance/index.html?inherit=1">第二章・完結編へ進む</a><button id="check">継承データを確認</button></div><div id="status" class="status">ブラウザ内の継承データを確認できます。</div></main><script>document.getElementById('check').onclick=()=>{const raw=localStorage.getItem('haimachi-series:chapter1-transfer');const el=document.getElementById('status');if(!raw){el.textContent='継承データは未検出です。第一章の正式報告後に「第二章・完結編へ進む」を押してください。';return;}try{const p=JSON.parse(raw);el.textContent=`検出：${p.player?.name||'巡察官'}／${p.chapter?.profileLabel||'第一章記録'}／結末「${p.chapter?.endingTitle||'未記録'}」`;}catch(e){el.textContent='継承データはありますが、読み取れませんでした。';}}</script><script>if('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
